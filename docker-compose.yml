version: '3.8'

services:
  kiro-go:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
      # redirects the browser to localhost:3128. Uncomment this AND set
      # KIRO_SSO_CALLBACK_BIND=0.0.0.0 below to complete that login from a
      # browser on the host while the proxy runs in this container.
      - "127.0.0.1:3128:3128"
    volumes:
      - ./data:/app/data
    environment:
      - CONFIG_PATH=/app/data/config.json
      - KIRO_SELECTION_STRATEGY=round_robin
      # Bind host for the Enterprise SSO callback listener INSIDE the container.
      # Default (unset) is loopback-only (127.0.0.1/::1), which the published port
      # above cannot reach; 0.0.0.0 lets the forwarded connection land. The callback
      # is transient (~10-minute login window) and anti-CSRF state-matched.
      - KIRO_SSO_CALLBACK_BIND=0.0.0.0
    restart: unless-stopped
